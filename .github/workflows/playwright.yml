name: Playwright
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: playwright-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    test:
        timeout-minutes: 20
        runs-on: ubuntu-latest
        env:
            BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npx playwright install --with-deps chromium
            - run: npm test
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-results
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
